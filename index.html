const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = u => { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const MEM = 'appidee.k.' + P.salt.slice(0, 12);
async function cle(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: ub(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, 256));
}
async function ouvrir(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const zip = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(P.iv) }, key, ub(P.data));
  const html = await new Response(new Blob([zip]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
(async () => { try { const k = localStorage.getItem(MEM) || sessionStorage.getItem(MEM); if (k) await ouvrir(ub(k)); } catch (e) { try { localStorage.removeItem(MEM); sessionStorage.removeItem(MEM); } catch (_) {} } })();
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault(); const err = document.getElementById('err'); err.textContent = 'Vérification…';
  try {
    const raw = await cle(document.getElementById('pw').value);
    try { await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(P.iv) }, await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']), ub(P.data)); }
    catch (x) { err.textContent = 'Mot de passe incorrect.'; return; }
    try { (document.getElementById('mem').checked ? localStorage : sessionStorage).setItem(MEM, b64(raw)); } catch (_) {}
    await ouvrir(raw);
  } catch (x) { err.textContent = 'Erreur : ' + x.message + ' (utilisez Chrome, Edge ou Safari récent).'; }
});
